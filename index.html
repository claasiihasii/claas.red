	<script>
		try {
			const saved = localStorage.getItem('theme');
			const prefersLight = matchMedia('(prefers-color-scheme: light)').matches;
			if (saved === 'light' || (!saved && prefersLight)) {
			document.documentElement.classList.add('light');
			}
		} catch (e) {}
	</script>
