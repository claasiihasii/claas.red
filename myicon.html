<!DOCTYPE html>
<html lang="de">

<head>
	<title>claas.red</title>
	<meta charset="utf-8">
	<meta name="description" content="67">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" type="text/css" href="./style/style.css">
	<link rel="icon" type="image/x-icon" href="./CZ-favicon.svg">

	<script>
		try {
			const saved = localStorage.getItem('theme');
			const prefersLight = matchMedia('(prefers-color-scheme: light)').matches;
			if (saved === 'light' || (!saved && prefersLight)) {
			document.documentElement.classList.add('light');
			}
		} catch (e) {}
	</script>

</head>

<body>

	<div class="header">
			
		<button class="dot" aria-label="Menü öffnen"></button>
			
	</div>

	<div class="main">
			
		<div class="mail">
			
			<a href="#">
				<img id="czicon" src="./CZ-favicon.svg" alt="My negative Space Icon">
			</a>
			
		</div>

		<nav class="footer-nav" aria-label="Seitennavigation">
			<a href="#">Main</a>
			<a id="vcard" href="//vcard.claas.red/">Visitenkarte</a>
		</nav>
						
	</div>
	
	<script src="./dot.js"></script>

</body>
	
</html>
